# Render Blueprint for the Aruba Email MCP server.
# In Render: New + -> Blueprint -> connect this repo -> pick this branch.
# Render reads this file and creates the service; you only fill in the 3 secrets.
services:
  - type: web
    name: aruba-email-mcp
    runtime: docker
    rootDir: mcp-aruba-email
    dockerfilePath: ./Dockerfile
    plan: free               # free tier: no cost. The server sleeps when idle and may re-ask the password.
    healthCheckPath: /
    autoDeploy: true
    envVars:
      # Your Aruba mailbox address (also the IMAP/SMTP username).
      - key: ARUBA_EMAIL
        sync: false
      # Your Aruba mailbox password (kept secret on the server; never sent to Claude).
      - key: ARUBA_PASSWORD
        sync: false
      # A password YOU invent — you'll type it once to authorize Claude.
      - key: ADMIN_LOGIN_PASSWORD
        sync: false
      # Signing key for OAuth tokens. Render generates it ONCE and keeps it stable
      # across restarts, so the connector stays authorized even on the free plan
      # (no re-login after the server sleeps/wakes).
      - key: OAUTH_SIGNING_KEY
        generateValue: true
    # NOTE: the free plan has no persistent disk, so OAuth tokens live only in
    # ephemeral storage and are lost when the server restarts/wakes — you simply
    # re-authorize in Claude when that happens (see README). Upgrade to a paid
    # plan + disk for always-on, no re-login.
