[project]
name = "aruba-email-mcp"
version = "0.1.0"
description = "Remote MCP server exposing an Aruba (IMAP/SMTP) mailbox to Claude as a custom connector, with read + send tools and a self-contained OAuth 2.1 authorization server."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.28,<2",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "starlette>=0.40",
    "uvicorn[standard]>=0.30",
    "anyio>=4.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
aruba-email-mcp = "aruba_email_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aruba_email_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
